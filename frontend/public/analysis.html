<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิเคราะห์กราฟ — Auto Weight</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html, body{height:100%;}
  body{display:flex; flex-direction:column; overflow:hidden;}
  .an{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding:12px 18px 14px; max-width:none;}
  .an-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .an-title .eyebrow{font-size:12px; color:var(--ink-3); font-weight:500;}
  .an-title h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-0.015em; line-height:1.25;}
  .an-title h1 .accent{color:var(--orange-500);}
  .an-top .spacer{flex:1;}
  #selScale{min-width:180px; font-weight:600;}
  .doc-badge{display:none; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:999px; background:var(--orange-50); color:var(--orange-600); font-weight:600; font-size:12.5px; border:1px solid var(--orange-100);}
  .doc-badge.show{display:inline-flex;}

  .an-controls{display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius-lg); padding:8px 12px; box-shadow:var(--shadow-xs);}
  .ctrl-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ctrl-group > .lbl{font-size:12.5px; font-weight:600; color:var(--ink-3);}
  #customBox{display:none; align-items:center; gap:6px;}
  #customBox.open{display:flex;}
  #customBox input{height:32px; width:200px; font-size:13px;}
  .seg button:disabled{opacity:.35; cursor:not-allowed;}
  .spec-choice{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .spec-choice[hidden]{display:none;}
  .spec-choice .sc-warn{display:flex; gap:6px; align-items:flex-start; font-size:12.5px; line-height:1.45; color:var(--ink); background:var(--orange-50); border:1px solid var(--orange-100); border-radius:9px; padding:7px 9px;}
  .spec-choice .sc-warn .i{color:var(--orange-600); flex:none; margin-top:2px;}

  .an-main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:12px;}
  .an-chart{display:flex; flex-direction:column; min-height:0; padding:12px 14px 10px;}
  .chart-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .chart-head b{font-size:15px;}
  .chart-head .meta{font-size:12.5px; color:var(--ink-3);}
  .chart-head .tools{margin-left:auto; display:flex; gap:6px; align-items:center;}
  .zoom-lvl{font-size:12px; color:var(--ink-3); min-width:42px; text-align:center; font-variant-numeric:tabular-nums;}
  .canvas-wrap{position:relative; flex:1; min-height:240px; border-radius:12px; overflow:hidden; touch-action:none; user-select:none;}
  .canvas-wrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
  #cvOver{cursor:crosshair;}
  #cvOver.panning{cursor:grabbing;}
  .chart-msg{position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--ink-3); font-size:14px; background:var(--surface);}
  .chart-msg.show{display:flex;}
  .tip{position:absolute; pointer-events:none; display:none; min-width:180px; max-width:280px; background:var(--surface); border:1px solid var(--hairline); border-radius:12px; box-shadow:var(--shadow-md); padding:10px 12px; font-size:12.5px; line-height:1.55; z-index:5;}
  .tip b{font-weight:700;}
  .tip .t-head{font-weight:700; margin-bottom:4px; font-size:13px;}
  .tip .row{display:flex; justify-content:space-between; gap:14px;}
  .tip .row span{color:var(--ink-3);}
  .chart-foot{display:flex; gap:6px 16px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); padding-top:8px;}
  .chart-foot i{display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle;}
  .chart-foot i.dash{height:0; border-top:2px dashed; border-radius:0;}
  .chart-foot .hint{margin-left:auto; color:var(--ink-3);}

  .an-side{display:flex; flex-direction:column; gap:12px; min-height:0; overflow-y:auto; padding-right:2px;}
  .an-side .card{padding:14px 16px;}
  .an-side h2{font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .an-side h2 .i{color:var(--blue-600);}
  .sum-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .sum-grid div{background:var(--surface-2); border:1px solid var(--hairline-2); border-radius:10px; padding:8px 10px;}
  .sum-grid span{display:block; font-size:11.5px; color:var(--ink-3);}
  .sum-grid b{font-size:16px; font-variant-numeric:tabular-nums;}
  .sum-grid .good b{color:var(--good);} .sum-grid .warn b{color:var(--caution);} .sum-grid .bad b{color:var(--bad);}
  .yield-bar{display:flex; height:12px; border-radius:999px; overflow:hidden; margin:12px 0 6px; background:var(--idle-bg);}
  .yield-bar div{height:100%;}
  .yield-legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--ink-2);}
  .yield-legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px;}
  .src-note{margin-top:8px; font-size:11.5px; color:var(--ink-3); line-height:1.5;}

  .insights{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .insights li{display:flex; gap:9px; font-size:13px; line-height:1.55; padding:9px 10px; border-radius:10px; background:var(--surface-2);}
  .insights li .i{width:17px; height:17px; flex:none; margin-top:2px;}
  .insights li.good{background:var(--good-bg);} .insights li.good .i{color:var(--good);}
  .insights li.warn{background:var(--caution-bg);} .insights li.warn .i{color:var(--caution);}
  .insights li.bad{background:var(--bad-bg);} .insights li.bad .i{color:var(--bad);}
  .insights li.info .i{color:var(--blue-600);}
  .picked{font-size:13px;}
  .picked .row{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--hairline-2);}
  .picked .row:last-child{border-bottom:none;}
  .picked .row span{color:var(--ink-3);}
  .picked .row b{font-variant-numeric:tabular-nums; text-align:right;}
  .spec-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .spec-row label{font-size:11.5px; color:var(--ink-3); display:block; margin-bottom:4px;}
  .spec-row input{width:100%; height:34px; font-size:13.5px; font-variant-numeric:tabular-nums;}
  .guide{font-size:13px; line-height:1.65; color:var(--ink-2);}
  .guide p{margin:0 0 8px;}
  .guide ul{margin:0; padding-left:18px;}
  .guide li{margin-bottom:4px;}

  :fullscreen #appbar{display:none;}
  @media (max-width:1100px){
    body{overflow:auto; display:block;}
    .an{height:auto;}
    .an-main{grid-template-columns:1fr;}
    .canvas-wrap{height:62vh; flex:none;}
    .an-side{overflow:visible;}
  }
  @media (max-width:560px){ #customBox input{width:100%;} #selScale{flex:1 1 100%;} .an{padding:10px;} }
</style>
</head>
<body data-page="dashboard">
<script src="assets/app-header.js"></script>
<div class="an">
  <div class="an-top">
    <a class="btn ghost" id="btnBack" href="dashboard.html"><svg class="i"><use href="assets/icons.svg#arrow-left"></use></svg><span>กลับ</span></a>
    <div class="an-title">
      <div class="eyebrow">วิเคราะห์ข้อมูลน้ำหนักแบบละเอียด</div>
      <h1><span id="anTitle">กราฟวิเคราะห์</span> <span class="accent" id="anScale"></span></h1>
    </div>
    <span class="doc-badge" id="docBadge"></span>
    <span class="spacer"></span>
    <select id="selScale" aria-label="เลือกเครื่อง"></select>
    <button class="btn" id="btnCsv" type="button"><svg class="i"><use href="assets/icons.svg#file"></use></svg>CSV</button>
    <button class="btn" id="btnFull" type="button"><svg class="i"><use href="assets/icons.svg#expand"></use></svg>เต็มจอ</button>
  </div>

  <div class="an-controls">
    <div class="ctrl-group"><span class="lbl">กราฟ</span><div class="seg" id="viewSeg"></div></div>
    <div class="ctrl-group" id="periodGroup"><span class="lbl">ช่วงเวลา</span><div class="seg" id="periodSeg"></div>
      <span id="customBox">
        <input type="datetime-local" id="fromInp" step="60" aria-label="ตั้งแต่">
        <span class="muted">ถึง</span>
        <input type="datetime-local" id="toInp" step="60" aria-label="ถึง">
        <button class="btn primary small" id="btnApply" type="button">ดู</button>
      </span>
    </div>
    <div class="ctrl-group" id="tfGroup"><span class="lbl">แท่งละ</span><div class="seg" id="tfSeg"></div></div>
  </div>

  <div class="an-main">
    <div class="card an-chart">
      <div class="chart-head">
        <b id="chartTitle">-</b><span class="meta" id="chartMeta"></span>
        <div class="tools">
          <button class="btn small icon-only" id="zOut" type="button" title="ซูมออก" aria-label="ซูมออก">−</button>
          <span class="zoom-lvl" id="zLvl">100%</span>
          <button class="btn small icon-only" id="zIn" type="button" title="ซูมเข้า" aria-label="ซูมเข้า">+</button>
          <button class="btn small icon-only" id="zReset" type="button" title="ดูทั้งช่วง" aria-label="ดูทั้งช่วง"><svg class="i"><use href="assets/icons.svg#refresh"></use></svg></button>
        </div>
      </div>
      <div class="canvas-wrap" id="wrap">
        <canvas id="cvBase"></canvas>
        <canvas id="cvOver"></canvas>
        <div class="tip" id="tip"></div>
        <div class="chart-msg show" id="chartMsg">กำลังโหลดข้อมูล…</div>
      </div>
      <div class="chart-foot" id="chartFoot"></div>
    </div>

    <aside class="an-side">
      <section class="card">
        <h2><svg class="i"><use href="assets/icons.svg#gauge"></use></svg>สรุปช่วงที่เลือก</h2>
        <div class="sum-grid" id="sumGrid"></div>
        <div class="yield-bar" id="yieldBar"></div>
        <div class="yield-legend" id="yieldLegend"></div>
        <div class="src-note" id="srcNote"></div>
      </section>
      <section class="card">
        <h2><svg class="i"><use href="assets/icons.svg#info"></use></svg>แปลผลอัตโนมัติ</h2>
        <ul class="insights" id="insights"></ul>
      </section>
      <section class="card">
        <h2><svg class="i"><use href="assets/icons.svg#search"></use></svg>จุดที่เลือก</h2>
        <div class="picked" id="picked"><span class="muted">คลิกจุดหรือแท่งบนกราฟเพื่อดูรายละเอียด</span></div>
      </section>
      <section class="card">
        <h2><svg class="i"><use href="assets/icons.svg#settings"></use></svg>สเปกที่ใช้คำนวณ</h2>
        <div class="spec-row">
          <div><label for="specL">LSL (g)</label><input id="specL" type="number" step="0.1"></div>
          <div><label for="specT">Target (g)</label><input id="specT" type="number" step="0.1"></div>
          <div><label for="specU">USL (g)</label><input id="specU" type="number" step="0.1"></div>
        </div>
        <div class="spec-choice" id="specChoice" hidden></div>
        <div class="src-note" id="specNote"></div>
      </section>
      <section class="card">
        <h2><svg class="i"><use href="assets/icons.svg#file"></use></svg>วิธีอ่านกราฟนี้</h2>
        <div class="guide" id="guide"></div>
      </section>
    </aside>
  </div>
</div>
<script src="assets/hist-bins.js"></script>
<script src="assets/analysis.js"></script>
</body>
</html>
