<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Auto Weight</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
  // หน้า Checkweigher ถูกรวมเข้า Dashboard แล้ว — ลิงก์เก่า/บุ๊กมาร์กพาไปที่ Dashboard ของเครื่องเดียวกัน
  (function () {
    var q = new URLSearchParams(location.search);
    var scale = q.get('scale');
    location.replace('dashboard.html' + (scale ? '?scale=' + encodeURIComponent(scale) : ''));
  })();
</script>
</head>
<body><p>หน้า Checkweigher รวมเข้า <a href="dashboard.html">Dashboard</a> แล้ว</p></body>
</html>
