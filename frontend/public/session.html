<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดเอกสาร — Auto Weight</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f2f6fb; --line:#dbe4f0;
    --text:#131a2b; --text-dim:rgba(19,26,43,0.65); --text-faint:rgba(19,26,43,0.45);
    --ok:#1d9e5a; --down:#d1453d; --brand:#2f8fef; --warn:#e8720c;
    --sans:Tahoma,Geneva,Verdana,sans-serif; --mono:Tahoma,Geneva,Verdana,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); padding:18px 22px;}
  h1{font-size:18px; margin:2px 0 3px;}
  .sub{font-size:12px; color:var(--text-faint); margin-bottom:16px;}
  a.back{color:var(--brand); text-decoration:none; font-size:12.5px; font-weight:700;}

  .top{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:0 2px 6px rgba(20,30,60,0.05);}
  .meta-card{flex:1 1 320px;}
  .meta-card .row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-bottom:1px dashed var(--line);}
  .meta-card .row:last-child{border-bottom:none;}
  .meta-card .row b{font-weight:700;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700;}
  .pill.running{background:rgba(47,143,239,0.12); color:var(--brand);}
  .pill.completed{background:rgba(29,158,90,0.12); color:var(--ok);}
  .pill.aborted{background:rgba(209,69,61,0.12); color:var(--down);}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; flex:1 1 380px;}
  .stat-box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center;}
  .stat-box .lbl{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .stat-box .val{font-size:18px; font-weight:700; font-family:var(--mono);}
  .stat-box.oos .val{color:var(--down);}

  .chart-card{padding:16px;}
  svg{width:100%; height:340px; display:block;}
  .axis{stroke:var(--line); stroke-width:1;}
  .gridline{stroke:var(--line); stroke-width:1; stroke-dasharray:3 3;}
  .lineTarget{stroke:var(--warn); stroke-width:1.4; stroke-dasharray:5 4;}
  .lineLimit{stroke:var(--down); stroke-width:1.2; stroke-dasharray:2 3;}
  .dot{fill:var(--brand);}
  .dot.oos{fill:var(--down);}
  .empty{padding:40px; text-align:center; color:var(--text-faint);}
</style>
</head>
<body data-page="history">
<script src="sidebar.js"></script>
<div id="app-sidebar-root"></div>

<a class="back" href="history.html">← กลับไปหน้าประวัติ</a>
<h1 id="pageTitle">รายละเอียดเอกสาร</h1>
<div class="sub" id="subLine">กำลังโหลด…</div>

<div class="top">
  <div class="card meta-card" id="metaCard"></div>
  <div class="stats" id="statGrid"></div>
</div>

<div class="card chart-card">
  <svg id="chart" viewBox="0 0 1000 340" preserveAspectRatio="none"></svg>
</div>

<script>
const $ = (id) => document.getElementById(id);
async function api(path){
  const res = await fetch(path, { cache:'no-store', headers:{accept:'application/json'} });
  let payload = null;
  try{ payload = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((payload && payload.error) || `HTTP ${res.status}`);
  return payload || {};
}

const sessionId = new URLSearchParams(location.search).get('id');

function fmtDT(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  const p = (n)=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function renderMeta(s){
  const statusLabel = { running:'กำลังทำ', completed:'เสร็จแล้ว', aborted:'ยกเลิก' }[s.status] || s.status;
  $('pageTitle').textContent = `เอกสาร #${s.id} — ${s.product_code}`;
  $('subLine').textContent = `${s.scale_name} · ${s.line || '-'} / S-N ${s.serial_no || '-'} · กะ ${s.shift || '-'} วันที่ ${s.report_date_be || '-'}`;
  $('metaCard').innerHTML = `
    <div class="row"><span>สถานะ</span><b><span class="pill ${s.status}">${statusLabel}</span></b></div>
    <div class="row"><span>Group Code</span><b>${s.group_code}</b></div>
    <div class="row"><span>Product Code</span><b>${s.product_code}</b></div>
    <div class="row"><span>Size / Package</span><b>${s.package_name || '-'}</b></div>
    <div class="row"><span>Customer</span><b>${s.customer || '-'}${s.destination ? ' ('+s.destination+')' : ''}</b></div>
    <div class="row"><span>เริ่ม</span><b>${fmtDT(s.start_time)}</b></div>
    <div class="row"><span>หยุด</span><b>${fmtDT(s.end_time)}</b></div>
    <div class="row"><span>เครื่องชั่ง</span><b>${s.scale_name} (${s.ip}:${s.port})</b></div>
    <div class="row"><span>Net Weight spec</span><b>T ${s.nw_target ?? '-'} / UCL ${s.nw_ucl ?? '-'} / LCL ${s.nw_lcl ?? '-'}</b></div>
    <div class="row"><span>Fill Weight spec</span><b>T ${s.fw_target ?? '-'} / UCL ${s.fw_ucl ?? '-'} / LCL ${s.fw_lcl ?? '-'}</b></div>
  `;
}

function renderStats(s){
  const boxes = [
    { lbl:'จำนวนค่า (N)', val: s.reading_count ?? '-' },
    { lbl:'ค่าเฉลี่ย', val: s.avg_weight != null ? s.avg_weight.toFixed(2) : '-' },
    { lbl:'ต่ำสุด', val: s.min_weight != null ? s.min_weight.toFixed(2) : '-' },
    { lbl:'สูงสุด', val: s.max_weight != null ? s.max_weight.toFixed(2) : '-' },
    { lbl:'เกินเกณฑ์', val: s.out_of_spec_count ?? '-', oos: !!s.out_of_spec_count },
  ];
  $('statGrid').innerHTML = boxes.map(b => `
    <div class="stat-box ${b.oos ? 'oos' : ''}"><div class="lbl">${b.lbl}</div><div class="val">${b.val}</div></div>
  `).join('');
}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function renderChart(rows, spec){
  const svg = $('chart');
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  if(!rows.length){
    svg.appendChild(el('text', { x:500, y:170, 'text-anchor':'middle', fill:'var(--text-faint)', 'font-size':13 })).textContent = 'ไม่มีค่าน้ำหนักบันทึกไว้ในเอกสารนี้';
    return;
  }

  const W = 1000, H = 340, PAD = 44;
  const values = rows.map(r => r.weight);
  const target = spec.nw_target, ucl = spec.nw_ucl, lcl = spec.nw_lcl;
  const specVals = [target, ucl, lcl].filter(v => v != null);
  const minV = Math.min(...values, ...specVals) - 1;
  const maxV = Math.max(...values, ...specVals) + 1;
  const xAt = (i) => PAD + (i / Math.max(1, rows.length - 1)) * (W - PAD * 2);
  const yAt = (v) => H - PAD - ((v - minV) / (maxV - minV || 1)) * (H - PAD * 2);

  // grid + axis
  svg.appendChild(el('line', { class:'axis', x1:PAD, y1:H-PAD, x2:W-PAD, y2:H-PAD }));
  svg.appendChild(el('line', { class:'axis', x1:PAD, y1:PAD/2, x2:PAD, y2:H-PAD }));

  function specLine(v, cls){
    if(v == null) return;
    const y = yAt(v);
    svg.appendChild(el('line', { class:cls, x1:PAD, y1:y, x2:W-PAD, y2:y }));
    const t = el('text', { x:W-PAD+4, y:y+3, 'font-size':10, fill:'var(--text-faint)' });
    t.textContent = v;
    svg.appendChild(t);
  }
  specLine(ucl, 'lineLimit');
  specLine(lcl, 'lineLimit');
  specLine(target, 'lineTarget');

  rows.forEach((r, i) => {
    const oos = (ucl != null && r.weight > ucl) || (lcl != null && r.weight < lcl);
    svg.appendChild(el('circle', { class:'dot' + (oos ? ' oos' : ''), cx:xAt(i), cy:yAt(r.weight), r:3 }));
  });
}

async function boot(){
  if(!sessionId){
    $('subLine').textContent = 'ไม่พบรหัสเอกสาร (ต้องเปิดผ่านลิงก์จากหน้าประวัติ)';
    return;
  }
  try{
    const [sessionRes, weightsRes] = await Promise.all([
      api(`/api/sessions/${sessionId}`),
      api(`/api/sessions/${sessionId}/weights?limit=20000`),
    ]);
    const s = sessionRes.session;
    renderMeta(s);
    renderStats(s);
    renderChart(weightsRes.rows || [], s);
  }catch(err){
    $('subLine').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + err.message;
    $('metaCard').innerHTML = `<div class="empty">${err.message}</div>`;
  }
}
boot();
</script>
</body>
</html>
